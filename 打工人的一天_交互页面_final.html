<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小元 · 打工人的一天 · 精简交互版</title>
<style>:root{--ink:#223038;--muted:#86949c;--sea:#1f9fbe;--deep:#14788f;--pale:#e6f3f7;--line:#e2e8ea;--paper:#f6f8f9;--phone:#f1f3f4;--shadow:0 30px 75px #22303814}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;color:inherit;background:none}
button:disabled{opacity:.35;cursor:default}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin:0 26px;gap:16px}
.brand{font-weight:750;font-size:22px;letter-spacing:-1px;display:flex;align-items:center;gap:11px;white-space:nowrap}
.brand em{font-style:normal;font-size:11px;letter-spacing:2px;color:#72868f;font-weight:500;border-left:1px solid #d5dfe2;padding-left:15px;margin-left:6px}
.mark{background:#1b96b5;color:#fff;width:31px;height:31px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.topright{font-size:12px;color:#7d8b92;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.smallbtn{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12px;white-space:nowrap}
.smallbtn.pri{background:#1f4f63;color:#fff;border-color:#1f4f63}
.smallbtn.on{background:#e3f2f6;border-color:#a9d4e0;color:#14657a}
.counter{font-size:12px;color:#55707b;min-width:130px;text-align:center}
.chapters{display:flex;gap:6px;margin:10px 26px 0;flex-wrap:wrap}
.chapter{display:flex;gap:8px;align-items:center;padding:5px 10px 5px 5px;border-radius:20px;color:#8c979e;font-size:12px}
.chapter .dot{width:24px;height:24px;border:1px solid #dbe3e6;border-radius:50%;font-size:10px;display:grid;place-items:center;background:var(--paper)}
.chapter small{font-size:10px;color:#a3adb2;margin-left:2px}
.chapter.active{color:#14788f;background:#e7f2f5}
.chapter.active .dot{background:#17819a;color:#fff;border-color:#17819a}
.chapter.done .dot{border-color:#90c0ce;color:#4d8fa0}
.layout{max-width:1800px;margin:auto;display:grid;grid-template-columns:232px 390px minmax(320px,.75fr) minmax(560px,1.4fr);gap:22px;padding:14px 26px 30px;align-items:start}
/* phone */
.phone{height:800px;width:390px;border-radius:43px;background:var(--phone);color:#272c2e;border:7px solid #fefefe;box-shadow:0 0 0 1px #dae0e2,var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone:before{content:"";position:absolute;width:92px;height:22px;border-radius:0 0 15px 15px;background:#fff;top:0;left:calc(50% - 46px);z-index:30}
.statusbar{height:42px;flex-shrink:0;padding:9px 23px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650}
.apphead{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 8px;flex-shrink:0}
.assistant-chip{background:#fff;border-radius:30px;padding:5px 14px 5px 5px;display:flex;gap:8px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#12b2d6;color:#fff;display:grid;place-items:center;font-weight:700}
.assistant-chip b{font-size:13px;display:block;line-height:1.2}
.assistant-chip small{font-size:10px;color:#86949c}
.headdate{font-size:10px;color:#7d8b92;text-align:right;line-height:1.5}
.screen{flex:1;overflow:auto;padding:4px 14px 14px;scrollbar-width:thin}
.daydiv{text-align:center;font-size:10px;color:#9aa6ab;margin:14px 0 8px}
.daydiv span{background:#e6eaeb;border-radius:10px;padding:2px 10px}
.ts{font-size:9px;color:#a3adb2;margin:8px 4px 2px}
.ts.r{text-align:right}
.bub{max-width:88%;padding:10px 13px;border-radius:17px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;cursor:pointer;position:relative}
.bub.agent{background:#fff;border-top-left-radius:6px;box-shadow:0 1px 2px #0000000a}
.bub.user{background:#1aa3c4;color:#fff;margin-left:auto;border-top-right-radius:6px}
.bub.fwd{background:#fff;margin-left:auto;border:1px solid #d6e4ea;color:#36505c;border-top-right-radius:6px}
.bub.fwd small{display:block;color:#7b949f;font-size:10px;margin-bottom:3px}
.bub.sel{outline:2px solid #6ac9de;outline-offset:2px}
.bub .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;white-space:normal}
.chip{display:inline-block;font-size:9.5px;line-height:1.4;padding:2px 7px;border-radius:10px;border:1px solid;white-space:nowrap}
.trig{font-size:10px;line-height:1.6;padding:7px 10px;border-radius:12px;border:1px dashed;margin:8px 0;cursor:pointer;white-space:pre-wrap}
.trig b{font-weight:600}
.trig.sel{outline:2px solid #6ac9de}
.expect{margin:4px 0 6px 6px;padding:6px 10px;border-left:3px solid #d9c98f;background:#fbf8ee;font-size:10px;color:#7a6c3e;border-radius:0 8px 8px 0;white-space:pre-wrap}
.expect b{color:#6d5d24}
.quietcard{font-size:10.5px;color:#6b7a80;background:#eef1f2;border:1px dashed #c3cdd1;border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer;white-space:pre-wrap}
.typing{font-size:11px;color:#6d8a95;background:#fff;border-radius:14px;padding:8px 12px;display:inline-flex;gap:8px;align-items:center;margin-top:8px}
.typing i{width:6px;height:6px;border-radius:50%;background:#1aa3c4;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.empty-chat{text-align:center;color:#9aa6ab;font-size:12px;margin-top:120px;line-height:2}
.composer{display:flex;gap:6px;align-items:center;margin:0 12px 8px;background:#fff;border-radius:22px;padding:6px 8px 6px 14px}
.composer input{flex:1;border:0;outline:0;font-size:12.5px;background:none}
.composer button{width:30px;height:30px;border-radius:50%;background:#1aa3c4;color:#fff;font-size:14px}
.tabs{height:71px;border:1px solid #fff;border-radius:38px;background:#f7f8f8;margin:0 9px 16px;padding:5px;display:flex;justify-content:space-around;flex-shrink:0;box-shadow:0 3px 15px #00000005}
.tab{width:76px;padding:6px 0 3px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:3px;font-size:10px;border-radius:30px;color:#8d9494;position:relative;cursor:pointer}
.tab .ic{font-size:15px;line-height:1}
.tab.active{background:#e9eded;color:#15adc9}
.tab .badge{position:absolute;top:2px;right:14px;background:#e0503b;color:#fff;border-radius:9px;font-size:9px;padding:0 5px}
.pane h2{font-size:22px;margin:6px 2px 10px}
.card{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:12px}
.card h4{margin:0 0 6px;font-size:13px}
.srow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f1f3f3;font-size:12px;align-items:flex-start}
.srow:last-child{border-bottom:0}
.srow b{width:84px;flex-shrink:0;color:#5c7f8b;font-weight:600}
.srow span{flex:1}
.srow.past{opacity:.45}
.srow.now b,.srow.now span{color:#0f93b3}
.srow em{font-style:normal;font-size:10px;color:#a8b0b2;display:block}
/* banner & lock */
.ios-push{position:absolute;left:10px;right:10px;top:40px;z-index:25;background:#ffffffee;backdrop-filter:blur(8px);border-radius:20px;box-shadow:0 10px 30px #0000002a;padding:11px 13px;display:flex;gap:10px;cursor:pointer;animation:dn .3s}
@keyframes dn{from{transform:translateY(-30px);opacity:0}}
.ios-push .pi{width:34px;height:34px;border-radius:9px;background:#1b96b5;color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.ios-push .pm{display:flex;justify-content:space-between;font-size:11px}
.ios-push .pm small{color:#8a979c}
.ios-push p{margin:2px 0 0;font-size:12px;line-height:1.55;max-height:56px;overflow:hidden;white-space:pre-line}
.lockscreen{position:absolute;inset:0;background:linear-gradient(155deg,#5e7f95,#9fb4b8 55%,#cbb89a);z-index:20;padding:44px 14px 18px;color:#fff;display:flex;flex-direction:column}
.lockscreen .lk{text-align:center;font-size:11px;opacity:.85}
.lockscreen time{font-size:66px;font-weight:300;text-align:center;display:block;line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums}
.lockscreen .lock-date{text-align:center;margin-bottom:16px;font-size:13px}
.lock-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.noti{background:#f9fcffe0;color:#263e59;border-radius:17px;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.noti.old{opacity:.72}
.noti.fresh{box-shadow:0 0 0 2px #ffe08a}
.noti small{font-size:9.5px;color:#687d91;display:flex;justify-content:space-between}
.noti p{font-size:11.5px;margin:3px 0 0;line-height:1.6;white-space:pre-line;max-height:74px;overflow:hidden}
.lock-bottom{text-align:center;font-size:10.5px;margin-top:10px}
.lock-bottom button{background:#ffffffcc;color:#385665;border-radius:30px;padding:9px 22px;font-size:12px}
.lock-bottom p{margin:6px 0 0;opacity:.85}
.toastroot{position:absolute;left:0;right:0;bottom:90px;display:flex;justify-content:center;z-index:40;pointer-events:none}
.toast{background:#223038e6;color:#fff;font-size:11px;padding:7px 14px;border-radius:16px;animation:dn .25s}
/* panels */
.panel{background:#fff;border:1px solid #d8e5ea;border-radius:22px;box-shadow:0 12px 35px #2944570a;overflow:hidden}
.ph{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph small{font-size:9px;color:#6c8d9b;letter-spacing:1.5px}
.ph h2{font-size:21px;margin:3px 0 0;font-weight:600}
.ph p{font-size:10.5px;color:#8a989f;margin:4px 0 0}
.status{font-size:10px;background:#e8f3f8;color:#23627d;border:1px solid #b9dbe8;padding:4px 9px;border-radius:20px;white-space:nowrap;cursor:pointer}
.ptabs{display:flex;gap:4px;padding:9px 12px;border-top:1px solid #e6edf0;border-bottom:1px solid #e6edf0;background:#f8fafb;flex-wrap:wrap}
.ptabs button{font-size:11px;padding:5px 10px;border-radius:8px;color:#70828c}
.ptabs .on{background:#214e65;color:#fff}
.pbody{padding:14px 16px;height:calc(100vh - 250px);min-height:560px;max-height:760px;overflow:auto;scrollbar-width:thin;font-size:12px}
.blk{margin:0 0 10px;border:1px solid #d6e4ea;border-radius:12px;overflow:hidden}
.blk .bh{padding:8px 12px;background:#edf5f8;display:flex;justify-content:space-between;gap:8px;align-items:center}
.blk .bh b{font-size:12px;color:#326478}
.blk .bh small{font-size:9.5px;color:#7b949f}
.blk .bb{padding:10px 12px;white-space:pre-wrap;line-height:1.75;font-size:11.5px;color:#3d4d54}
.blk.back{border-color:#dcd7ee}.blk.back .bh{background:#f3f0fb}.blk.back .bh b{color:#6d598c}
.blk.out{border-color:#cfe6d6}.blk.out .bh{background:#eef7f0}.blk.out .bh b{color:#3f7a53}
.blk.del{border-color:#f0dcc0}.blk.del .bh{background:#fdf5ea}.blk.del .bh b{color:#9a6418}
.arrow{text-align:center;color:#9ab1bb;font-size:11px;margin:-4px 0 6px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:11.5px}
.kv dt{color:#7b949f}.kv dd{margin:0}
.pts{background:#fbfaf6;border:1px solid #eeeadf;border-radius:12px;padding:10px 12px;font-size:11.5px;color:#6b6450;white-space:pre-wrap}
.memi{border:1px solid #ece6cf;background:#fffdf6;border-radius:10px;padding:9px 11px;margin-bottom:8px}
.memi b{font-size:11px;color:#8a6d12}
.memi p{margin:3px 0;font-size:11.5px}
.memi small{color:#9a9480;font-size:10px}
.docb{border:1px solid #e1dcf0;border-radius:10px;margin-bottom:8px;overflow:hidden}
.docb summary{padding:8px 11px;background:#f6f4fb;cursor:pointer;font-size:11.5px}
.docb summary .ok{color:#1f9d63}.docb summary .no{color:#c2410c}
.docb div{padding:8px 11px;white-space:pre-wrap;font-size:11px;line-height:1.75;color:#454a55;max-height:340px;overflow:auto}
/* ---- 泳道接口契约：入参 / 出参 ---- */
.apiwrap{margin:0 0 10px;border:1px solid #cfdce4;border-radius:12px;overflow:hidden;background:#fbfdfe}
.apiwrap>.bh{padding:8px 12px;background:#eaf2f7;display:flex;justify-content:space-between;gap:8px;align-items:center}
.apiwrap>.bh b{font-size:12px;color:#2d5f7a}
.apiwrap>.bh small{font-size:9.5px;color:#7b949f;font-family:ui-monospace,Menlo,monospace}
.apiin{padding:8px 10px}
.apib{border:1px solid #dde7ec;border-radius:9px;margin-bottom:6px;overflow:hidden;background:#fff}
.apib:last-child{margin-bottom:0}
.apib>summary{padding:7px 10px;cursor:pointer;font-size:11px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;list-style:none}
.apib>summary::-webkit-details-marker{display:none}
.apib>summary:before{content:"▸";color:#8fa8b4;font-size:10px}
.apib[open]>summary:before{content:"▾"}
.apib[open]>summary{background:#f4f9fb;border-bottom:1px solid #e6eef2}
.apim{font:10px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;font-weight:600;background:#e8f1e9;color:#3f7a53}
.apim.get{background:#e9eefb;color:#44568f}
.apim.put{background:#fbf2e4;color:#8a6212}
.apip{font:10px ui-monospace,Menlo,monospace;color:#44616f;flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apib>summary em{font-style:normal;font-size:9.5px;color:#8aa0ab}
.apibd{padding:8px 10px}
.apisec{font-size:10px;font-weight:600;color:#5b7f91;margin:8px 0 4px;display:flex;gap:6px;align-items:center}
.apisec:first-child{margin-top:0}
.apisec i{font-style:normal;font-size:9px;padding:0 5px;border-radius:4px;background:#eef4f7;color:#6b8898;font-family:ui-monospace,Menlo,monospace}
.apit{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
.apit th{background:#f5f9fb;color:#60808f;font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid #e4ecf0;font-size:9.5px}
.apit th:nth-child(1){width:34%}.apit th:nth-child(2){width:17%}
.apit td{padding:4px 6px;border-bottom:1px solid #f0f4f6;vertical-align:top;color:#4e626c;overflow-wrap:anywhere}
.apit tr:last-child td{border-bottom:0}
.apit code{font:10px ui-monospace,Menlo,monospace;color:#2f6180}
.apit .rq{color:#c2410c;font-size:9px}
.apit .op{color:#9ab0bb;font-size:9px}
.apinote{font-size:9.5px;color:#8da3ad;line-height:1.65;margin:7px 0 0;padding-top:6px;border-top:1px dashed #e4ecf0}
.apisrc{font-size:9px;padding:0 5px;border-radius:4px;border:1px solid}
.apisrc.s{background:#eef7f0;color:#3f7a53;border-color:#bcdcc5}
.apisrc.i{background:#f3f0fb;color:#6d598c;border-color:#d3c9ea}
.apisrc.n{background:#fdf5ea;color:#9a6418;border-color:#ecd3ae}
.apisec .apicp{margin-left:auto;font-size:9.5px;padding:1px 8px;border:1px solid #d5e1e5;border-radius:6px;background:#fff;color:#35586a}
.apisec .apicp:hover{background:#eef6f9}
pre.apij{margin:0 0 4px;padding:8px 10px;font:10px/1.6 ui-monospace,Menlo,monospace;color:#2f4f5e;background:#f7fafb;border:1px solid #e3eaed;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto}
.apifd{margin-top:8px;border:1px dashed #d5e1e5;border-radius:8px;background:#fcfdfd}
.apifd>summary{padding:5px 9px;font-size:10px;color:#6b8898;cursor:pointer}
.apifd[open]>summary{border-bottom:1px dashed #e4ecf0}
.apifd>.apisec,.apifd>.apit{margin-left:8px;margin-right:8px;width:calc(100% - 16px)}
.apifd>.apit:last-child{margin-bottom:8px}
.trhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.trhead b{display:block;font:12px ui-monospace,Menlo,monospace;color:#214e65}
.trhead small{font-size:10px;color:#7d8f98}
.trsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.trsum>div{border:1px solid #e3eaed;border-radius:9px;padding:6px 8px;background:#fbfcfd}
.trsum b{display:block;font-size:14px;color:#214e65;font-weight:600}
.trsum span{font-size:9.5px;color:#7d8f98}
.trd{border:1px solid #dde7ec;border-radius:9px;margin-bottom:6px;background:#fff;overflow:hidden}
.trd>summary{padding:7px 10px;cursor:pointer;font-size:11px;display:flex;gap:7px;align-items:center;list-style:none;color:#3d5560}
.trd>summary::-webkit-details-marker{display:none}
.trd>summary:before{content:"▸";color:#8fa8b4;font-size:10px}
.trd[open]>summary:before{content:"▾"}
.trd[open]>summary{background:#f4f9fb;border-bottom:1px solid #e6eef2}
.trd>pre.apij{margin:8px;max-height:420px}
.trid{font:10px ui-monospace,Menlo,monospace;color:#8aa0ab}
.trt{font:10px ui-monospace,Menlo,monospace;color:#5c7f8b;white-space:nowrap}
.trn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trd>summary em{font-style:normal;font-size:9.5px;color:#8aa0ab;white-space:nowrap}
.trm{font-size:9px;padding:0 5px;border-radius:4px;border:1px solid}
.trm.live{background:#eef7f0;color:#3f7a53;border-color:#bcdcc5}
.trm.backfill{background:#f1f3f4;color:#66737a;border-color:#c7d0d4}
.trm.skipped{background:#fdf5ea;color:#9a6418;border-color:#ecd3ae}
pre.json.trjson{max-height:none;font-size:10px;line-height:1.55;color:#2f4f5e}
pre.json{margin:0;padding:10px 12px;font:10px/1.6 ui-monospace,Menlo,monospace;color:#587079;white-space:pre-wrap;word-break:break-all;background:#fbfcfd;border:1px solid #e3eaed;border-radius:10px;max-height:560px;overflow:auto}
.muted{color:#8a989f;font-size:10.5px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pbtn{font-size:11px;padding:5px 10px;border:1px solid #d5e1e5;border-radius:8px;background:#fff;color:#35586a}
.pbtn.on{background:#214e65;color:#fff;border-color:#214e65}
.pbtn.go{background:#1aa3c4;color:#fff;border-color:#1aa3c4}
/* clock */
.clockface{background:linear-gradient(135deg,#17384a,#1f5d73);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.clockface .cf1{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.85}
.clockface .big{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.2;margin:4px 0}
.clockface .cf2{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;opacity:.9}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:5px;animation:bl 1s infinite}
.live-dot.off{background:#f59e0b;animation:none}
.ctl{border:1px solid #e3eaed;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ctl h4{margin:0 0 8px;font-size:12px;color:#315f73}
.ctl label{font-size:11px;color:#6b7f88;margin-right:4px}
.ctl select,.ctl input{border:1px solid #d5e1e5;border-radius:8px;padding:4px 8px;font-size:12px;background:#fff}
.seg{display:inline-flex;border:1px solid #d5e1e5;border-radius:9px;overflow:hidden;vertical-align:middle}
.seg button{font-size:11px;padding:5px 10px;color:#55707b;border-right:1px solid #e3eaed}
.seg button:last-child{border-right:0}
.seg button.on{background:#214e65;color:#fff}
.nextbox{font-size:11px;background:#f4f8f9;border-radius:10px;padding:8px 10px;color:#4b6470;line-height:1.7}
.nextbox b{color:#14657a}
.lane{width:100%;border-collapse:collapse;font-size:11px}
.lane th{position:sticky;top:-14px;background:#f3f7f8;color:#56707b;font-weight:600;text-align:left;padding:6px;border-bottom:1px solid #dfe8eb;z-index:1}
.lane td{padding:6px;border-bottom:1px solid #eef2f3;vertical-align:top;cursor:pointer}
.lane tr.pend td{opacity:.38}
